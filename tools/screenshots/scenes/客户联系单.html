<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>客户联系单（演示）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    background: #eef1f6; color: #1f2430; display: flex; min-height: 100vh;
  }
  .card {
    width: calc(100% - 48px); max-width: 960px; margin: auto; background: #fff; border-radius: 18px; padding: 44px 56px 38px;
    box-shadow: 0 10px 40px rgba(31, 36, 48, .12);
  }
  h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: .04em; }
  .sub { color: #7a8294; font-size: 19px; margin-bottom: 26px; }
  table { width: 100%; border-collapse: collapse; font-size: 24px; }
  td { padding: 15px 4px; border-top: 1px solid #e6e9f0; }
  td:first-child { width: 150px; color: #7a8294; }
  td:last-child { font-weight: 600; letter-spacing: .02em; }
  .note { margin-top: 24px; padding: 14px 18px; border-radius: 10px; background: #f3f6fc; color: #55607a; font-size: 19px; }
</style>
</head>
<body>
<div class="card">
  <h1>客户联系单</h1>
  <div class="sub">2026 年第三季度 · 回访登记（全部是虚构的演示数据）</div>
  <table>
    <tr><td>客户</td><td>张三</td></tr>
    <tr><td>手机</td><td>13800000000</td></tr>
    <tr><td>备用电话</td><td>13900000000</td></tr>
    <tr><td>身份证</td><td>110101199001010023</td></tr>
    <tr><td>邮箱</td><td>zhangsan@example.com</td></tr>
    <tr><td>银行卡</td><td>6222020000000000018</td></tr>
    <tr><td>回访结论</td><td>满意，下季度继续合作</td></tr>
  </table>
  <div class="note">以上号码、证件号都是随手编的，只用来演示智能打码。</div>
</div>
</body>
</html>
